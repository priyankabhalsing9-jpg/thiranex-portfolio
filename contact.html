    <main id="main-content">

        <section class="container" aria-labelledby="contact-heading">

            <h1 id="contact-heading">Contact Me</h1>

            <p>
                If you would like to get in touch with me,
                please fill out the form below.
            </p>

        </section>

        <section class="container" aria-labelledby="form-heading">

            <h2 id="form-heading">Contact Form</h2>

            <form id="contact-form">

                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>
