

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple To-Do List application to manage daily tasks.">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="todo-form">
            <label for="task-input">Add a new task</label>
            <div class="input-group">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter your task..."
                    maxlength="200"
                    required
                >
                <button type="submit">Add Task</button>
            </div>
        </form>

        <p id="task-count" aria-live="polite">0 tasks remaining</p>

        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="task-list" aria-label="Your tasks"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
